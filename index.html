<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meus Pokémon GO</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--h:40px;--ink:#16181d;--mute:#5d6470;--paper:#f2f3f5;--card:#fff;--line:#d3d7de;--red:#d93a35;--gold:#e0a800;--teal:#0f8b8d;--rocket:#6b3fa0;--blue:#2f6fca;--amber:#b8741a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Archivo,system-ui,sans-serif;padding:32px 20px 80px}
main{max-width:1000px;margin:auto}
h1{font-size:1.8rem;line-height:1.1;margin:0 0 20px;font-weight:700;letter-spacing:-.01em}
.form{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
input:not([type=checkbox]){height:var(--h);padding:0 12px}
input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.chip{cursor:pointer;user-select:none;position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;height:var(--h);padding:0 14px;border-radius:6px;border:1px solid var(--line)}
.chip input:checked+span{border-color:transparent;color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.c-hundo input:checked+span{background:var(--gold);color:#1a1400}
.c-shiny input:checked+span{background:var(--teal)}
.c-shadow input:checked+span{background:var(--rocket)}
.c-purified input:checked+span{background:var(--blue)}
.c-lucky input:checked+span{background:var(--amber)}
.c-mega input:checked+span{background:var(--red)}
button{font:inherit;cursor:pointer;border:1px solid transparent;border-radius:6px;padding:0 16px;height:var(--h);display:inline-flex;align-items:center;justify-content:center;background:var(--red);color:#fff;font-weight:500}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.acts .ghost{height:32px;padding:0 4px;font-size:.8rem}
button.ghost:hover{border-color:var(--ink)}
#msg{font-size:.9rem;color:#b3261e}
.bar{display:flex;align-items:flex-end;gap:22px;margin:32px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;color:var(--mute);border:0;border-bottom:3px solid transparent;border-radius:0;height:auto;padding:8px 0;font-size:1.05rem;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
#q{margin:0 0 8px auto;width:170px}
.f{background:transparent;color:var(--ink);border:1px solid var(--line);padding:0 14px;border-radius:6px}
.f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;padding-bottom:12px}
.card.hundo{border:2px solid var(--gold)}
.pic{order:1;height:160px;display:grid;place-items:center;background:#e6eaef}
.card.lucky .pic{background:#f1e2a8}
.card.purified .pic{background:#cfe0f6}
.card.shadow .pic{background:#3a2555}
.pic img{max-width:135px;max-height:135px}
.card.shadow .pic img{filter:saturate(.5) brightness(.75) sepia(.5) hue-rotate(230deg)}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px)}
.b{font-size:.72rem;font-weight:700;padding:2px 6px;border-radius:3px;color:#fff;border:1px solid #fffb}
.b.hundo{background:var(--gold);color:#1a1400}
.b.shiny{background:var(--teal)}
.b.shadow{background:var(--rocket)}
.b.purified{background:var(--blue)}
.b.lucky{background:var(--amber)}
.b.mega{background:var(--red)}
.nm,.cp,.from,.nt,.acts{padding:0 12px}
.nm{order:2;padding-top:10px;font-weight:700;font-size:1.05rem;text-transform:capitalize}
.id{font-weight:400;color:var(--mute);font-size:.85rem}
.cp{order:3;font-size:.9rem;color:var(--mute)}
.cp b{color:var(--ink);font-weight:700}
.from{order:4;font-size:.8rem;color:var(--mute)}
.nt{order:5;font-size:.85rem;color:var(--mute);overflow-wrap:anywhere}
.cp:empty,.from:empty,.nt:empty{display:none}
.acts{order:6;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;margin-top:auto;padding-top:10px}
.empty{grid-column:1/-1;padding:20px 0;color:var(--mute)}
#count{margin:0 0 12px}
#fbtn{margin-bottom:8px}
.iv{order:3;padding:0 12px;font-size:.9rem;color:var(--mute)}
.iv:empty{display:none}
.fr{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.grow{flex:1 1 180px}
.fld.cpf{width:96px}
.fld input{width:100%}
.fld>label,.lab{font-size:.8rem;font-weight:500;color:var(--mute)}
.fld.ivf{width:96px}
.ivres{width:100%;height:var(--h);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-weight:700}
.ivres.dim{font-size:.9rem;font-weight:400;color:var(--mute)}
.ivrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.ivrow .fld.ivf{width:auto}
.dlg>.fld,.dlg>.ivrow{margin-bottom:12px}
.lv{margin-left:12px}
.dlg>.fr{margin-bottom:12px}
.tools{margin-top:36px;display:flex;gap:8px;flex-wrap:wrap}
.dlg{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:20px;width:min(440px,92vw)}
.dlg::backdrop{background:#0006}
.dlg h2{margin:0 0 12px;font-size:1.25rem;text-transform:capitalize}
.dlg .row{margin-bottom:12px}
.dlg input:not([type=checkbox]){width:100%}
.dlg .row input[type=number]{width:120px}
.hint{font-size:.88rem;color:var(--mute)}
.evo{background:transparent;color:var(--ink);border:1px solid var(--line);padding:0 14px;text-transform:capitalize}
.evo.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dlg .end{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<main>
<h1>Meus Pokémon GO</h1>

<div class="form">
  <div class="fr">
    <div class="fld grow"><label for="name">Pokémon</label><input id="name" list="names" placeholder="Nome ou número" autocomplete="off"></div>
    <div class="fld cpf"><label for="cp">CP</label><input id="cp" type="number" min="10" placeholder="2450"></div>
    <div class="fld cpf"><span class="lab">Nível</span><output class="ivres dim" id="lvRes" for="name cp iA iD iS">—</output></div>
  </div>
  <div class="fr">
    <div class="fld ivf"><label for="iA">IV Ataque</label><input id="iA" type="number" min="0" max="15" placeholder="0 a 15"></div>
    <div class="fld ivf"><label for="iD">IV Defesa</label><input id="iD" type="number" min="0" max="15" placeholder="0 a 15"></div>
    <div class="fld ivf"><label for="iS">IV PS</label><input id="iS" type="number" min="0" max="15" placeholder="0 a 15"></div>
    <div class="fld ivf"><span class="lab">IV total</span><output class="ivres dim" id="ivRes" for="iA iD iS">—</output></div>
    <div class="fld grow"><label for="note">Anotação</label><input id="note" placeholder="Opcional"></div>
  </div>
  <div class="fld">
    <span class="lab">Variantes</span>
    <div class="row">
      <label class="chip c-hundo"><input type="checkbox" id="hundo"><span>100%</span></label>
      <label class="chip c-shiny"><input type="checkbox" id="shiny"><span>Shiny</span></label>
      <label class="chip c-shadow"><input type="checkbox" id="shadow"><span>Sombroso (Rocket)</span></label>
      <label class="chip c-purified"><input type="checkbox" id="purified"><span>Purificado</span></label>
      <label class="chip c-lucky"><input type="checkbox" id="lucky"><span>Sortudo</span></label>
      <label class="chip c-mega"><input type="checkbox" id="mega"><span>Mega</span></label>
    </div>
  </div>
  <div class="row">
    <button id="addHave">Adicionar em “Tenho”</button>
    <button id="addWant" class="alt">Adicionar em “Quero pegar”</button>
    <span id="msg" role="status"></span>
  </div>
</div>
<datalist id="names"></datalist>

<div class="bar">
  <button class="tab on" data-t="have"></button>
  <button class="tab" data-t="want"></button>
  <input id="q" placeholder="Buscar nome…" aria-label="Buscar">
  <button class="ghost" id="fbtn">Filtrar / Ordenar</button>
</div>
<p class="hint" id="count" role="status"></p>
<div class="grid" id="grid"></div>

<div class="tools">
  <button class="ghost" id="exp">Exportar backup</button>
  <button class="ghost" id="imp">Importar backup</button>
  <input type="file" id="file" accept=".json" hidden>
</div>
</main>

<dialog class="dlg" id="dFil">
  <h2>Filtrar e ordenar</h2>
  <p class="hint">Ordenar por</p>
  <div class="row" id="fSort"></div>
  <p class="hint">Mostrar apenas</p>
  <div class="row" id="fTags"></div>
  <div class="end"><button class="ghost" id="fClr">Limpar</button><button id="fOk">Fechar</button></div>
</dialog>
<dialog class="dlg" id="dEdit">
  <h2 id="eTitle"></h2>
  <span class="lab">Variantes</span>
  <div class="row" id="eFlags"></div>
  <div class="fr"><div class="fld cpf"><label for="eCp">CP</label><input id="eCp" type="number" min="10"></div><div class="fld cpf"><span class="lab">Nível</span><output class="ivres dim" id="eLv" for="eCp eA eD eS">—</output></div></div>
  <div class="fld"><label for="eNote">Anotação</label><input id="eNote"></div>
  <div class="ivrow">
    <div class="fld ivf"><label for="eA">IV Ataque</label><input id="eA" type="number" min="0" max="15" placeholder="0 a 15"></div>
    <div class="fld ivf"><label for="eD">IV Defesa</label><input id="eD" type="number" min="0" max="15" placeholder="0 a 15"></div>
    <div class="fld ivf"><label for="eS">IV PS</label><input id="eS" type="number" min="0" max="15" placeholder="0 a 15"></div>
    <div class="fld ivf"><span class="lab">IV total</span><output class="ivres dim" id="eRes" for="eA eD eS">—</output></div>
  </div>
  <div id="eMsg" class="hint" style="color:#b3261e;min-height:1.2em" role="status"></div>
  <div class="end"><button class="ghost" id="eCancel">Cancelar</button><button id="eSave">Salvar</button></div>
</dialog>
<dialog class="dlg" id="dEvo">
  <h2 id="vTitle"></h2>
  <p class="hint">Escolha a evolução:</p>
  <div class="row" id="vOpts"></div>
  <div class="row"><input id="vName" list="names" placeholder="Ou digite outro nome / número" autocomplete="off"></div>
  <div class="row"><input id="vCp" type="number" min="10" placeholder="CP depois de evoluir"></div>
  <div id="vMsg" class="hint" style="color:#b3261e;min-height:1.2em" role="status"></div>
  <div class="end"><button class="ghost" id="vCancel">Cancelar</button><button id="vOk">Evoluir</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const ART='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
const FLAGS={hundo:'100%',shiny:'Shiny',shadow:'Rocket',purified:'Purificado',lucky:'Sortudo',mega:'Mega'};
let dex={},data={have:[],want:[]},tab='have',flt='all',sortKey='add';

try{const s=JSON.parse(localStorage.getItem('pgo')||'null');if(s)data=s}catch(e){}
const save=()=>{try{localStorage.setItem('pgo',JSON.stringify(data))}catch(e){}};

async function loadDex(){
  try{const c=JSON.parse(localStorage.getItem('pgo-dex')||'null');if(c)dex=c}catch(e){}
  if(!Object.keys(dex).length){
    try{
      const j=await (await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025')).json();
      j.results.forEach(p=>dex[p.name]=+p.url.split('/').filter(Boolean).pop());
      try{localStorage.setItem('pgo-dex',JSON.stringify(dex))}catch(e){}
    }catch(e){$('msg').textContent='Sem internet para carregar os nomes. Você ainda pode usar o número da Pokédex.'}
  }
  $('names').innerHTML=Object.keys(dex).map(n=>`<option value="${n}">`).join('');
}

function resolve(txt){
  const t=txt.trim().toLowerCase().replace(/\s+/g,'-');
  if(/^\d+$/.test(t)){
    const id=+t;
    return id>0&&id<=1025?{id,name:Object.keys(dex).find(k=>dex[k]===id)||('#'+id)}:null;
  }
  return dex[t]?{id:dex[t],name:t}:null;
}

function add(list){
  const p=resolve($('name').value);
  if(!p){$('msg').textContent='Não encontrei esse Pokémon. Use o nome em inglês ou o número da Pokédex.';return}
  const iv=readIV('iA','iD','iS');
  if(iv===false){$('msg').textContent='Preencha os três IVs (ataque, defesa e PS) ou deixe todos vazios.';return}
  $('msg').textContent='';
  const e={uid:Date.now()+Math.random(),id:p.id,name:p.name,cp:$('cp').value,note:$('note').value.trim(),iv};
  Object.keys(FLAGS).forEach(f=>e[f]=$(f).checked);
  if(iv&&iv.every(x=>x===15))e.hundo=true;
  data[list].push(e);save();
  ['name','cp','note','iA','iD','iS'].forEach(i=>$(i).value='');
  showIV('iA','iD','iS','ivRes');
  upd();
  tab=list;render();
}

function pic(e){
  const img=document.createElement('img');
  img.alt=e.name;img.loading='lazy';
  const normal=ART+e.id+'.png';
  img.src=e.shiny?ART+'shiny/'+e.id+'.png':normal;
  img.onerror=()=>{if(img.src!==normal)img.src=normal;else img.replaceWith(document.createTextNode('?'))};
  return img;
}

const SORTS=[['add','Ordem de adição'],['recent','Mais recentes'],['cpd','CP: maior primeiro'],['cpa','CP: menor primeiro'],['ivd','IV: maior primeiro'],['iva','IV: menor primeiro'],['name','Nome (A-Z)'],['dex','Número da Pokédex']];
function drawFil(){
  const mk=(box,list,cur,set)=>{
    $(box).innerHTML='';
    list.forEach(([k,v])=>{
      const b=document.createElement('button');
      b.className='f'+(cur()===k?' on':'');b.textContent=v;
      b.onclick=()=>{set(k);drawFil();render()};
      $(box).append(b);
    });
  };
  mk('fSort',SORTS,()=>sortKey,k=>sortKey=k);
  mk('fTags',[['all','Todos'],...Object.entries(FLAGS)],()=>flt,k=>flt=k);
}

function render(){
  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('on',b.dataset.t===tab);
    b.textContent=(b.dataset.t==='have'?'Tenho':'Quero pegar')+' ('+data[b.dataset.t].length+')';
  });
  const act=(flt!=='all')+(sortKey!=='add');
  $('fbtn').textContent='Filtrar / Ordenar'+(act?' ('+act+')':'');
  const q=$('q').value.trim().toLowerCase();
  const g=$('grid');g.innerHTML='';
  const cpOf=e=>e.cp===''||e.cp==null?null:+e.cp;
  const items=data[tab].filter(e=>(!q||e.name.includes(q))&&(flt==='all'||e[flt]));
  const so=sortKey,big=1e9;
  const cmp={
    cpd:(a,b)=>(cpOf(b)??-1)-(cpOf(a)??-1),
    cpa:(a,b)=>(cpOf(a)??big)-(cpOf(b)??big),
    ivd:(a,b)=>(ivp(b)??-1)-(ivp(a)??-1),
    iva:(a,b)=>(ivp(a)??big)-(ivp(b)??big),
    name:(a,b)=>a.name.localeCompare(b.name),
    dex:(a,b)=>a.id-b.id
  }[so];
  if(so==='recent')items.reverse();else if(cmp)items.sort(cmp);
  $('count').textContent=items.length+' de '+data[tab].length+' Pokémon';
  if(!items.length){g.innerHTML='<div class="empty">'+(data[tab].length?'Nenhum Pokémon com esses filtros.':'Nenhum Pokémon nesta lista. Adicione pelo formulário acima.')+'</div>';return}
  items.forEach(e=>{
    const on=Object.keys(FLAGS).filter(f=>e[f]);
    const c=document.createElement('div');
    c.className='card '+on.join(' ');
    const lt=levelText(e);
    c.innerHTML=`<div class="cp">${e.cp?'CP <b>'+(+e.cp|0)+'</b>'+(lt?'<span class="lv">Nível <b>'+lt+'</b></span>':''):''}</div><div class="pic"></div><div class="badges">${on.map(f=>`<span class="b ${f}">${FLAGS[f]}</span>`).join('')}</div><div class="nm"></div><div class="from"></div><div class="iv"></div><div class="nt"></div><div class="acts"></div>`;
    c.querySelector('.pic').append(pic(e));
    const nm=c.querySelector('.nm');nm.textContent=e.name+' ';
    const id=document.createElement('span');id.className='id';id.textContent='#'+e.id;nm.append(id);
    c.querySelector('.nt').textContent=e.note||'';
    c.querySelector('.from').textContent=e.evolvedFrom?'Evoluiu de '+e.evolvedFrom:'';
    c.querySelector('.iv').textContent=e.iv?'IV '+String(ivp(e)).replace('.',',')+'% ('+e.iv.join('/')+')':'';
    const a=c.querySelector('.acts');
    const mk=(t,fn)=>{const b=document.createElement('button');b.className='ghost';b.textContent=t;b.onclick=fn;a.append(b)};
    if(tab==='want')mk('Peguei!',()=>{data.want=data.want.filter(x=>x.uid!==e.uid);data.have.push(e);save();render()});
    else{const ev=evoCache[e.id];if((ev&&ev.length)||(!ev&&evoFail.has(e.id)))mk('Evoluir',()=>openEvo(e))}
    mk('Editar',()=>openEdit(e));
    const d=document.createElement('button');d.className='ghost';d.textContent='Remover';
    d.onclick=()=>{data[tab]=data[tab].filter(x=>x.uid!==e.uid);save();render()};
    a.append(d);g.append(c);
  });
  const need=[...new Set(items.filter(e=>e.iv&&cpOf(e)&&!e.mega).map(e=>e.id))].filter(id=>!statsOf(id)&&!statsFail.has(id));
  if(need.length)Promise.all(need.map(getStats)).then(render);
  if(tab==='have'){
    const miss=[...new Set(items.map(e=>e.id))].filter(id=>!evoCache[id]&&!evoFail.has(id));
    if(miss.length)Promise.all(miss.map(getEvos)).then(render);
  }
}

// Game Master do Pokémon GO (PokeMiners/game_masters), níveis 1 a 51.
// Meios níveis: raiz da média dos quadrados dos multiplicadores vizinhos.
const CPI=[0.094,0.16639787,0.21573247,0.25572005,0.29024988,0.3210876,0.34921268,0.3752356,0.39956728,0.4225,0.44310755,0.4627984,0.48168495,0.49985844,0.51739395,0.5343543,0.5507927,0.5667545,0.5822789,0.5974,0.6121573,0.6265671,0.64065295,0.65443563,0.667934,0.6811649,0.69414365,0.7068842,0.7193991,0.7317,0.7377695,0.74378943,0.74976104,0.7556855,0.76156384,0.76739717,0.7731865,0.77893275,0.784637,0.7903,0.7953,0.8003,0.8053,0.8103,0.8153,0.8203,0.8253,0.8303,0.8353,0.8403,0.8453];
const cpm=l=>{
  if(Number.isInteger(l))return CPI[l-1];
  const a=CPI[Math.floor(l)-1],b=CPI[Math.ceil(l)-1];
  return Math.sqrt((a*a+b*b)/2);
};
let statsCache={};try{statsCache=JSON.parse(localStorage.getItem('pgo-stats')||'{}')}catch(e){}

const statsOf=id=>GO_STATS[id-1]||statsCache[id];
async function getStats(id){
  if(statsOf(id))return statsOf(id);
  try{
    const j=await (await fetch('https://pokeapi.co/api/v2/pokemon/'+id)).json();
    const st={};j.stats.forEach(x=>st[x.stat.name]=x.base_stat);
    const sp=1+(st.speed-75)/500,A=st.attack,SA=st['special-attack'],D=st.defense,SD=st['special-defense'];
    statsCache[id]=[
      Math.round(2*(7/8*Math.max(A,SA)+1/8*Math.min(A,SA))*sp),
      Math.round(2*(5/8*Math.max(D,SD)+3/8*Math.min(D,SD))*sp),
      st.hp===1?1:Math.floor(st.hp*1.75+50)
    ];
    try{localStorage.setItem('pgo-stats',JSON.stringify(statsCache))}catch(e){}
    return statsCache[id];
  }catch(err){statsFail.add(id);return null}
}
function calcLevel(st,iv,cp){
  const base=(st[0]+iv[0])*Math.sqrt(st[1]+iv[1])*Math.sqrt(st[2]+iv[2]);
  const ex=[];let best=null;
  for(let l=1;l<=51;l+=0.5){
    const c=Math.max(10,Math.floor(base*cpm(l)*cpm(l)/10));
    if(c===cp)ex.push(l);
    const d=Math.abs(c-cp);
    if(!best||d<best.d)best={l,d};
  }
  if(ex.length)return{lo:ex[0],hi:ex[ex.length-1],exact:true};
  if(best.d<=Math.max(3,cp*0.015))return{lo:best.l,hi:best.l,exact:false};
  return null;
}
const fmtLv=r=>{const f=n=>String(n).replace('.',',');return r.exact?(r.lo===r.hi?f(r.lo):f(r.lo)+' a '+f(r.hi)):'~'+f(r.lo)};
function levelText(e){
  const cp=+e.cp,st=statsOf(e.id);
  if(e.mega||!e.iv||!cp||!st)return '';
  const r=calcLevel(st,e.iv,cp);
  return r?fmtLv(r):'';
}
async function updateLv(out,id,cpId,ivIds,mega){
  const el=$(out),tok=el._t=(el._t||0)+1;
  const set=(t,dim)=>{if(el._t!==tok)return;el.textContent=t;el.classList.toggle('dim',dim)};
  const iv=readIV(...ivIds),cp=+$(cpId).value;
  if(!id||!cp||!iv||mega){set('—',true);return}
  const st=await getStats(id);
  if(!st){set('—',true);return}
  const r=calcLevel(st,iv,cp);
  set(r?fmtLv(r):'Não confere',!r);
}
const ivp=e=>e.iv?Math.round(e.iv.reduce((a,b)=>a+b,0)/45*1000)/10:null;
function showIV(a,b,c,out){
  const v=[a,b,c].map(i=>$(i).value),el=$(out);
  let t='—',dim=true;
  if(v.some(x=>x!=='')){
    if(v.some(x=>x===''||isNaN(x)))t='Incompleto';
    else{
      const sum=v.reduce((n,x)=>n+Math.min(15,Math.max(0,+x)),0);
      t=(Math.round(sum/45*1000)/10).toLocaleString('pt-BR')+'%';dim=false;
    }
  }
  el.textContent=t;el.classList.toggle('dim',dim);
}
function readIV(a,b,c){
  const v=[a,b,c].map(i=>$(i).value);
  if(v.every(x=>x===''))return null;
  if(v.some(x=>x===''||isNaN(x)))return false;
  return v.map(x=>Math.min(15,Math.max(0,Math.round(+x))));
}
let evoCache={};try{evoCache=JSON.parse(localStorage.getItem('pgo-evo')||'{}')}catch(e){}
const evoFail=new Set();
async function getEvos(id){
  if(evoCache[id])return evoCache[id];
  try{
    const sp=await (await fetch('https://pokeapi.co/api/v2/pokemon-species/'+id)).json();
    const ch=await (await fetch(sp.evolution_chain.url)).json();
    const find=n=>n.species.name===sp.name?n:n.evolves_to.map(find).find(Boolean);
    const node=find(ch.chain);
    evoCache[id]=node?node.evolves_to.map(n=>n.species.name):[];
    try{localStorage.setItem('pgo-evo',JSON.stringify(evoCache))}catch(e){}
    return evoCache[id];
  }catch(err){evoFail.add(id);return null}
}
let cur=null;

    l.querySelector('input').checked=!!e[f];box.append(l);
  });
  $('eCp').value=e.cp||'';$('eNote').value=e.note||'';

}
$('eSave').onclick=()=>{

  save();$('dEdit').close();render();
};
$('eCancel').onclick=()=>$('dEdit').close();

async function openEvo(e){
  cur=e;$('vTitle').textContent='Evoluir '+e.name;
  $('vName').value='';$('vCp').value='';$('vMsg').textContent='';
  const box=$('vOpts');box.innerHTML='<span class="hint">Buscando evoluções…</span>';
  $('dEvo').showModal();
  const list=(await getEvos(e.id))||[];
  box.innerHTML='';
  if(!list.length){box.innerHTML='<span class="hint">Nenhuma evolução encontrada. Digite o nome abaixo.</span>';return}
  list.forEach(n=>{
    const b=document.createElement('button');b.className='evo';b.textContent=n;
    b.onclick=()=>{$('vName').value=n;box.querySelectorAll('.evo').forEach(x=>x.classList.toggle('on',x===b))};
    box.append(b);
  });
}
$('vOk').onclick=()=>{
  const p=resolve($('vName').value);
  if(!p){$('vMsg').textContent='Escolha uma evolução ou digite um nome válido.';return}
  cur.evolvedFrom=cur.name;cur.id=p.id;cur.name=p.name;cur.cp=$('vCp').value;
  save();$('dEvo').close();render();
};
$('vCancel').onclick=()=>$('dEvo').close();

$('addHave').onclick=()=>add('have');
$('addWant').onclick=()=>add('want');
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')add(tab)});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
const upd=()=>{const p=resolve($('name').value);updateLv('lvRes',p&&p.id,'cp',['iA','iD','iS'],$('mega').checked)};
['name','cp','iA','iD','iS'].forEach(i=>$(i).addEventListener('input',upd));
$('mega').addEventListener('change',upd);
const eMega=()=>document.querySelector('#eFlags input[data-f=mega]').checked;
const eUpd=()=>updateLv('eLv',cur&&cur.id,'eCp',['eA','eD','eS'],eMega());
['eCp','eA','eD','eS'].forEach(i=>$(i).addEventListener('input',eUpd));
$('eFlags').addEventListener('change',eUpd);
$('q').oninput=render;
['iA','iD','iS'].forEach(i=>$(i).oninput=()=>{
  showIV('iA','iD','iS','ivRes');
  if(['iA','iD','iS'].every(x=>$(x).value==='15'))$('hundo').checked=true;
});
['eA','eD','eS'].forEach(i=>$(i).oninput=()=>{
  showIV('eA','eD','eS','eRes');
  if(['eA','eD','eS'].every(x=>$(x).value==='15'))document.querySelector('#eFlags input[data-f=hundo]').checked=true;
});
$('fbtn').onclick=()=>{drawFil();$('dFil').showModal()};
$('fOk').onclick=()=>$('dFil').close();
$('fClr').onclick=()=>{flt='all';sortKey='add';drawFil();render()};
$('exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download='meus-pokemon-go.json';a.click();
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async ev=>{
  try{const j=JSON.parse(await ev.target.files[0].text());
    if(Array.isArray(j.have)&&Array.isArray(j.want)){data=j;save();render()}
  }catch(e){$('msg').textContent='Arquivo de backup inválido.'}
};
loadDex();render();
</script>
</body>
</html>
